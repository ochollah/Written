    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --gold: #d4af37;
            --dark-bg: #020202;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body { background: var(--dark-bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-sacred { font-family: 'Cinzel', serif; }
        
        .btn-gold { 
            background: var(--gold); 
            color: #000; 
            font-weight: 600; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4); }

        .theme-circle { 
            width: 140px; height: 140px; 
            border-radius: 50%; 
            overflow: hidden; 
            border: 1px solid rgba(212, 175, 55, 0.1); 
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
            background: #050505; 
        }
        .theme-circle:hover { border-color: var(--gold); transform: scale(1.08); }

        /* Modern Scripture Display */
        .scripture-display-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2rem;
            padding: 3rem 2rem;
            position: relative;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .verse-text {
            font-size: 1.75rem;
            line-height: 1.6;
            font-weight: 300;
            color: #e4e4e7;
            letter-spacing: -0.01em;
            transition: all 0.8s ease;
        }
        
        @media (min-width: 768px) {
            .verse-text { font-size: 2.25rem; }
            .scripture-display-card { padding: 5rem 4rem; }
        }

        .verse-reference {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-top: 2.5rem;
            opacity: 0.8;
        }

        .verse-float { animation: fadeInUp 0.8s ease-out; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-container {
            height: 2px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>

    <script>
        let currentVerseIndex = 0;
        let activeVerses = [];
        let allThemes = [];
        let recognition;
        let isMeditationActive = false;
        let currentThemeName = "";
        let completionStatus = []; 
        let scriptureWords = [];

        async function handleLogin() {
            const e = document.getElementById('adm-email').value;
            const p = document.getElementById('adm-pass').value;
            try { await fb.signInWithEmailAndPassword(fb.auth, e, p); showPage('admin'); } catch(err) { alert("Access Denied"); }
        }
        function handleLogout() { fb.signOut(fb.auth).then(() => location.reload()); }
        
        function showPage(id) {
            ['page-user', 'page-admin', 'page-login'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
            if(id === 'user') exitMeditation();
        }

        function initLibrary() {
            fb.onSnapshot(fb.query(fb.collection(fb.db, "themes"), fb.orderBy("timestamp", "desc")), (snap) => {
                allThemes = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderGrid(allThemes);
                renderAdminList(allThemes);
                populateExportOptions();
            });
            initAnalytics();
        }

        function renderGrid(themes) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = themes.map(t => `
                <div onclick="openMeditation('${t.id}')" class="flex flex-col items-center gap-8 cursor-pointer group">
                    <div class="theme-circle shadow-2xl">
                        <img src="${t.image || 'https://via.placeholder.com/150/050505/d4af37?text=The+Word'}" class="w-full h-full object-cover opacity-30 group-hover:opacity-100 transition duration-700">
                    </div>
                    <h3 class="font-sacred text-[9px] tracking-[0.4em] uppercase text-zinc-500 group-hover:text-[#d4af37] transition-all">${t.theme}</h3>
                </div>
            `).join('');
        }

        async function openMeditation(id) {
            const target = allThemes.find(t => t.id === id);
            activeVerses = target.verses;
            currentThemeName = target.theme;
            currentVerseIndex = 0;
            completionStatus = new Array(activeVerses.length).fill(false);
            
            document.getElementById('grid-container').classList.add('hidden');
            document.getElementById('meditation-zone').classList.remove('hidden');
            document.getElementById('total-verses').innerText = activeVerses.length;
            document.getElementById('btn-amen').disabled = true;
            
            isMeditationActive = true;
            loadVerse(0);
            startVoiceEngine();
        }

        function loadVerse(index) {
            scriptureWords = activeVerses[index].text.toLowerCase()
                .split(/\W+/)
                .filter(w => w.length > 2)
                .map(w => ({ word: w, met: false }));

            const display = document.getElementById('active-verse-text');
            const refDisp = document.getElementById('active-verse-ref');
            
            display.classList.remove('verse-float');
            void display.offsetWidth; // Trigger reflow
            display.classList.add('verse-float');

            // Format scripture into elegant paragraphs
            const text = activeVerses[index].text;
            display.innerHTML = text.length > 100 ? `<p class="mb-4">${text}</p>` : text;
            refDisp.innerText = activeVerses[index].ref;
            
            document.getElementById('verse-count').innerText = index + 1;
            const p = completionStatus[index] ? 100 : 0;
            document.getElementById('verse-prog-bar').style.width = p + "%";
            document.getElementById('word-match-stats').innerText = p + "% Manifested";
        }

        function startVoiceEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return;
            
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if(!isMeditationActive) return;
                let transcript = ""; 
                for (let i = event.resultIndex; i < event.results.length; ++i) transcript += event.results[i][0].transcript.toLowerCase();
                
                const spokenWords = transcript.split(/\W+/);
                spokenWords.forEach(spoken => {
                    const target = scriptureWords.find(item => item.word === spoken && !item.met);
                    if(target) target.met = true;
                });

                const p = Math.round((scriptureWords.filter(item => item.met).length / scriptureWords.length) * 100);
                document.getElementById('verse-prog-bar').style.width = p + "%";
                document.getElementById('word-match-stats').innerText = p + "% Manifested";

                if (p >= 65 || transcript.includes("amen")) {
                    completionStatus[currentVerseIndex] = true;
                    checkFinalAmen();
                }
            };

            recognition.onend = () => { if(isMeditationActive) try { recognition.start(); } catch(e) {} };
            recognition.start();
        }

        function checkFinalAmen() {
            if(completionStatus.every(s => s === true)) {
                const btn = document.getElementById('btn-amen');
                btn.disabled = false;
                btn.className = "px-16 py-5 rounded-full btn-gold text-black shadow-2xl font-bold uppercase tracking-[0.4em] scale-105 transition-all";
            }
        }

        function nextVerse() { if (currentVerseIndex < activeVerses.length - 1) { currentVerseIndex++; loadVerse(currentVerseIndex); } }
        function prevVerse() { if (currentVerseIndex > 0) { currentVerseIndex--; loadVerse(currentVerseIndex); } }
        function exitMeditation() {
            isMeditationActive = false;
            if(recognition) { recognition.onend = null; recognition.stop(); }
            document.getElementById('meditation-zone').classList.add('hidden');
            document.getElementById('grid-container').classList.remove('hidden');
        }

        function renderAdminList(themes) {
            const list = document.getElementById('admin-theme-list');
            list.innerHTML = themes.map(t => `
                <div class="bg-zinc-900/40 p-8 rounded-[2.5rem] flex justify-between items-center border border-white/5 hover:border-[#d4af37]/30 transition-all">
                    <div>
                        <div class="text-[10px] font-sacred text-[#d4af37] tracking-widest uppercase">${t.theme}</div>
                        <div class="text-[8px] text-zinc-600 mt-2 font-bold uppercase">${t.verses.length} Scriptures</div>
                    </div>
                    <div class="flex gap-6">
                        <button onclick="loadForEdit('${t.id}')" class="text-[9px] font-bold text-zinc-400 hover:text-white uppercase tracking-widest transition-colors">Edit</button>
                        <button onclick="confirmDelete('${t.id}')" class="text-[9px] font-bold text-red-900 hover:text-red-500 uppercase tracking-widest transition-colors">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function confirmDelete(id) {
            if(confirm("Permanently remove this word?")) await fb.deleteDoc(fb.doc(fb.db, "themes", id));
        }

        function loadForEdit(id) {
            const t = allThemes.find(x => x.id === id);
            if(!t) return;
            document.getElementById('edit-id').value = t.id;
            document.getElementById('in-theme').value = t.theme;
            document.getElementById('verse-inputs').innerHTML = "";
            t.verses.forEach(v => addVerseField(v));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetEditor() {
            document.getElementById('edit-id').value = "";
            document.getElementById('in-theme').value = "";
            document.getElementById('verse-inputs').innerHTML = "";
            document.getElementById('in-file').value = "";
        }

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = 500;
                        const scale = MAX_W / img.width;
                        canvas.width = MAX_W; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        async function saveTheme() {
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('in-theme').value;
            const fileInput = document.getElementById('in-file');
            if(!title) return alert("Title required.");

            let b64 = "";
            if(fileInput.files[0]) b64 = await compressImage(fileInput.files[0]);
            else if(id) b64 = allThemes.find(x => x.id === id).image;

            const verses = [];
            document.querySelectorAll('.verse-entry').forEach(el => {
                const t = el.querySelector('.v-text').value;
                const r = el.querySelector('.v-ref').value;
                if(t && r) verses.push({ text: t, ref: r });
            });

            const data = { theme: title, image: b64, verses, timestamp: new Date() };
            try {
                if(id) await fb.updateDoc(fb.doc(fb.db, "themes", id), data);
                else await fb.addDoc(fb.collection(fb.db, "themes"), data);
                resetEditor();
            } catch(e) { alert(e.message); }
        }

        function addVerseField(val = {ref: '', text: ''}) {
            const div = document.createElement('div');
            div.className = "verse-entry bg-black/40 p-6 rounded-[2rem] border border-white/5 space-y-4";
            div.innerHTML = `
                <div class="flex gap-4">
                    <input type="text" placeholder="John 3:16" class="v-ref flex-1 bg-black border border-white/10 p-4 rounded-xl text-[10px] text-white outline-none focus:border-[#d4af37]" value="${val.ref}">
                    <button onclick="fetchVerse(this)" class="bg-zinc-800 px-6 rounded-xl text-[8px] font-bold uppercase text-[#d4af37] hover:bg-zinc-700 transition-colors">Fetch KJV</button>
                </div>
                <textarea class="v-text w-full bg-black border border-white/10 p-5 rounded-xl text-[11px] outline-none focus:border-[#d4af37] min-h-[100px]" placeholder="Scripture Text">${val.text}</textarea>
                <button onclick="this.parentElement.remove()" class="text-[8px] font-bold text-red-900 uppercase hover:text-red-500 transition-colors">Remove Verse</button>
            `;
            document.getElementById('verse-inputs').appendChild(div);
        }

        async function fetchVerse(btn) {
            const container = btn.closest('.verse-entry');
            const ref = container.querySelector('.v-ref').value;
            if(!ref) return;
            btn.innerText = "Connecting...";
            try {
                // Modified to force KJV version
                const res = await fetch(`https://bible-api.com/${ref}?translation=KJV`);
                const data = await res.json();
                if(data.text) {
                    container.querySelector('.v-text').value = data.text.trim();
                    btn.innerText = "Fetched";
                } else btn.innerText = "Failed";
            } catch(e) { btn.innerText = "Error"; }
        }

        function openAmenModal() { document.getElementById('modal-amen').classList.remove('hidden'); }
        async function submitAmen() {

    const n = document.getElementById('reg-name').value;
    const p = document.getElementById('reg-phone').value;

    if (!n || !p) return alert("Details required.");

    await fb.addDoc(
        fb.collection(fb.db, "userLeads"),
        {
            name: n,
            phone: p,
            theme: currentThemeName,
            timestamp: new Date()
        }
    );

    // =========================
    // ADMIN WHATSAPP MESSAGE
    // =========================

    const adminNumber = "254711176811";

    const adminMessage =
`NEW THEME COMPLETION

Name: ${n}
Phone: ${p}
Theme: ${currentThemeName}`;

    const adminWhatsAppURL =
`https://wa.me/${adminNumber}?text=${encodeURIComponent(adminMessage)}`;

    let cleanUserNumber = p.replace(/\D/g, '');

    if (cleanUserNumber.startsWith("0")) {

    }

    const userMessage =
`Thank you ${n} for declaring God's words on the theme "${currentThemeName}".

Our Pastor will call you and pray with you shortly.

Be blessed.In Jesus Name`;

    const userWhatsAppURL =
`https://wa.me/${cleanUserNumber}?text=${encodeURIComponent(userMessage)}`;

    window.open(adminWhatsAppURL, "_blank");

}

        async function exportThemeDaily() {
    const theme = document.getElementById('export-theme').value;
    const dateStr = document.getElementById('export-date').value;

    if (!theme || !dateStr) return alert("Select Theme and Date.");

    const start = new Date(dateStr);
    start.setHours(0,0,0,0);

    const end = new Date(dateStr);
    end.setHours(23,59,59,999);

    const q = fb.query(
        fb.collection(fb.db, "userLeads"),
        fb.where("theme", "==", theme),
        fb.where("timestamp", ">=", start),
        fb.where("timestamp", "<=", end)
    );

    const snap = await fb.getDocs(q);

    const data = snap.docs.map(d => ({
        Name: d.data().name,
        Phone: d.data().phone,
        Theme: d.data().theme,
        Time: d.data().timestamp.toDate().toLocaleString()
    }));

    if (data.length === 0) {
        return alert("No records found for selected date.");
    }

    const ws = XLSX.utils.json_to_sheet(data);
    const csv = XLSX.utils.sheet_to_csv(ws);

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);

    link.setAttribute("href", url);
    link.setAttribute("download", `${theme}_${dateStr}.csv`);

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

        function populateExportOptions() {
            const select = document.getElementById('export-theme');
            if (select) select.innerHTML = '<option value="">Select Theme</option>' + allThemes.map(t => `<option value="${t.theme}">${t.theme}</option>`).join('');
        }
        function filterThemes() {
            const term = document.getElementById('user-search').value.toLowerCase();
            renderGrid(allThemes.filter(t => t.theme.toLowerCase().includes(term)));
        }
        function initAnalytics() {
            fb.onSnapshot(fb.collection(fb.db, "userLeads"), (snap) => {
                const leads = snap.docs.map(d => d.data()), counts = {};
                leads.forEach(l => counts[l.theme] = (counts[l.theme] || 0) + 1);
                const ctx = document.getElementById('leadsChart').getContext('2d');
                if(window.myChart) window.myChart.destroy();
                window.myChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: '#d4af37', borderRadius: 20 }] },
                    options: { 
                        plugins: { legend: { display: false } },
                        scales: { 
                            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#444' } },
                            x: { grid: { display: false }, ticks: { color: '#444', font: { size: 8 } } }
                        } 
                    }
                });
            });
        }

        window.onload = () => {
            initLibrary();
            fb.onAuthStateChanged(fb.auth, u => { 
                if(u) { 
                    const navBtn = document.getElementById('adm-nav-btn');
                    navBtn.innerText = "Dashboard"; 
                    navBtn.onclick = () => showPage('admin'); 
                } 
            });
        };
    </script>
