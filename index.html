<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, getDocs, query, orderBy, where, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBI_Hm3CcapHZaFnuypy43cKveGlunRyK0",

            projectId: "written-778d3",
            storageBucket: "written-778d3.firebasestorage.app",

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --dark-bg: #030304;
            --glass: rgba(18, 18, 22, 0.65);
            --glass-border: rgba(212, 175, 55, 0.15);
        }

        body { 
            background: var(--dark-bg); 
            color: #f4f4f5; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; 
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
        }

        .font-sacred { font-family: 'Cinzel', serif; }
        .font-sacred-title { font-family: 'Cinzel Decorative', serif; }
        
        .btn-gold { 
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%); 
            color: #000; 
            font-weight: 700; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
        }
        .btn-gold:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.45); 
            filter: brightness(1.1);
        }
        .btn-gold:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: #52525b;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
        }

        .theme-circle { 
            width: 150px; height: 150px; 
            border-radius: 50%; 
            overflow: hidden; 
            border: 1px solid var(--glass-border); 
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            background: #08080a; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .theme-circle:hover { 
            border-color: var(--gold); 
            transform: scale(1.05) translateY(-5px); 
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.2);
        }

        /* Modern Scripture Display Styling */
        .scripture-display-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 2.5rem;
            padding: 3rem 2rem;
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Responsive Text Formatting */
        .verse-text {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            line-height: 1.8;
            font-weight: 600;
            color: #f4f4f5;
            letter-spacing: 0.01em;
            transition: all 0.5s ease;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        @media (min-width: 640px) {
            .verse-text { font-size: 1.85rem; line-height: 1.8; }
            .scripture-display-card { padding: 4rem 3.5rem; }
        }
        @media (min-width: 1024px) {
            .verse-text { font-size: 2.25rem; line-height: 1.8; }
        }

        .word-unit {
            transition: color 0.3s ease, text-shadow 0.3s ease;
            display: inline-block;
            margin: 0 0.2em;
        }
        .word-unit.manifested {
            color: var(--gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
            font-weight: 700;
        }

        .verse-reference {
            font-family: 'Cinzel Decorative', serif;
            color: var(--gold-light);
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 2.5rem;
            opacity: 0.9;
        }

        .verse-float { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-container {
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .nav-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s ease;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.4);
            color: #fff;
            transform: translateY(-2px);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    </style>
</head>
<body>

    <nav class="p-5 bg-black/80 backdrop-blur-md border-b border-white/5 flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-sacred text-[#d4af37] tracking-[0.3em] text-[10px] md:text-xs cursor-pointer hover:opacity-80 transition-opacity" onclick="location.reload()">THE LIVING WORD</h1>
        <div class="flex items-center gap-6">
            <input type="text" id="user-search" oninput="filterThemes()" placeholder="Search Archive..." class="bg-white/5 border border-white/10 rounded-full px-5 py-2 text-[10px] outline-none focus:border-[#d4af37] w-32 md:w-56 transition-all">
            <button id="adm-nav-btn" onclick="showPage('login')" class="text-[9px] font-semibold uppercase border border-[#d4af37]/30 text-[#d4af37] px-5 py-2 rounded-full hover:bg-[#d4af37] hover:text-black transition-all">Admin Access</button>
        </div>
    </nav>

    <section id="page-user" class="min-h-screen py-16 px-4 md:px-6">
        <div id="grid-container" class="max-w-7xl mx-auto flex flex-wrap justify-center gap-10 md:gap-14"></div>

        <div id="meditation-zone" class="hidden flex flex-col items-center max-w-4xl mx-auto">
            <div class="w-full flex justify-between items-center mb-10">
                <button onclick="exitMeditation()" class="text-[10px] text-zinc-400 font-bold uppercase tracking-[0.2em] hover:text-white transition-colors flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/5">
                    <span class="text-sm">←</span> Library
                </button>
                <div id="mic-status" class="text-[10px] text-[#d4af37] font-bold uppercase tracking-[0.2em] flex items-center gap-2 bg-[#d4af37]/10 px-4 py-2 rounded-full border border-[#d4af37]/20">
                    <div class="w-2 h-2 bg-[#d4af37] rounded-full animate-ping"></div>
                    Engine Listening
                </div>
            </div>
            
            <div class="w-full mb-10">
                <div class="flex justify-between items-end text-[11px] uppercase font-bold tracking-widest mb-3 text-zinc-400">
                    <span class="text-white flex items-center gap-2">
                        Scripture <span id="verse-count" class="text-[#d4af37] text-sm">1</span> 
                        <span class="opacity-30">/</span> 
                        <span id="total-verses" class="text-zinc-500">1</span>
                    </span>
                    <div class="text-right">
                        <span id="current-verse-manifest" class="text-[#d4af37] font-bold">0% Verse</span>

                        <span id="theme-total-manifest" class="text-zinc-400">0% Theme Total</span>
                    </div>

                <div class="progress-bar-container">
                    <div id="verse-prog-bar" class="h-full bg-gradient-to-r from-[#aa820a] to-[#d4af37] w-0 transition-all duration-300 ease-out"></div>
                </div>

            <div class="scripture-display-card text-center">
                <div id="active-verse-text" class="verse-text verse-float"></div>
                <div id="active-verse-ref" class="verse-reference"></div>
            </div>

            <!-- Navigation and Seal Controls -->
            <div class="w-full max-w-2xl flex flex-col md:flex-row justify-between items-center gap-6 mt-12">
                <div class="flex gap-4 w-full md:w-auto justify-between">
                    <button id="btn-prev" onclick="prevVerse()" class="nav-btn px-6 py-3.5 rounded-full text-zinc-300 uppercase text-[10px] font-bold tracking-[0.2em] flex items-center gap-2">
                        <span>←</span> Prev
                    </button>
                    <button id="btn-next" onclick="nextVerse()" class="nav-btn px-6 py-3.5 rounded-full text-zinc-300 uppercase text-[10px] font-bold tracking-[0.2em] flex items-center gap-2">
                        Next <span>→</span>
                    </button>
                </div>

                <button id="btn-amen" disabled onclick="openAmenModal()" class="w-full md:w-auto px-12 py-4 rounded-full btn-gold text-black font-bold uppercase tracking-[0.3em] text-xs transition-all">
                    Seal Amen
                </button>
            </div>
        </div>
    </section>

    <section id="page-login" class="hidden min-h-[80vh] flex items-center justify-center p-4">
        <div class="bg-zinc-900/40 p-10 md:p-12 rounded-[2.5rem] border border-white/10 w-full max-w-md text-center backdrop-blur-xl shadow-2xl">
            <h2 class="font-sacred text-[#d4af37] text-2xl mb-2 uppercase tracking-[0.3em]">Sanctuary</h2>
            <p class="text-[10px] text-zinc-500 uppercase tracking-widest mb-8">Admin Authentication</p>
            <input type="email" id="adm-email" placeholder="Credential Email" class="w-full bg-black/60 border border-white/10 p-4 rounded-2xl mb-4 outline-none focus:border-[#d4af37] text-xs transition-all text-white">
            <input type="password" id="adm-pass" placeholder="Security Token" class="w-full bg-black/60 border border-white/10 p-4 rounded-2xl mb-8 outline-none focus:border-[#d4af37] text-xs transition-all text-white">
            <button onclick="handleLogin()" class="w-full btn-gold py-4 rounded-2xl text-[10px] uppercase tracking-widest">Authorize</button>
        </div>
    </section>

    <section id="page-admin" class="hidden p-6 lg:p-16">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-8 border-b border-white/5 pb-8">
            <div>
                <h2 class="font-sacred text-[#d4af37] text-3xl tracking-tight">WORD ARCHITECT</h2>
                <p class="text-[10px] text-zinc-500 uppercase mt-2 font-bold tracking-[0.3em]">Theme & Record Intelligence</p>
            </div>
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center gap-3">
                    <select id="export-theme" class="bg-black border border-white/10 text-[10px] px-4 py-3 rounded-xl outline-none focus:border-[#d4af37] text-white">
                        <option value="">Select Theme</option>
                    </select>
                    <input type="date" id="export-date" class="bg-black border border-white/10 text-[10px] px-4 py-3 rounded-xl outline-none focus:border-[#d4af37] text-white">
                </div>
                <button onclick="exportThemeDaily()" class="text-[9px] bg-white/5 hover:bg-white/10 text-white px-6 py-3.5 rounded-full border border-white/10 font-bold uppercase transition-all">Export Report</button>
                <button onclick="handleLogout()" class="text-[9px] text-red-500 font-bold uppercase tracking-widest border border-red-500/20 px-6 py-3.5 rounded-full hover:bg-red-500/10 transition-all">Exit</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div class="lg:col-span-5 bg-zinc-950/60 p-8 md:p-10 rounded-[3rem] border border-white/5 space-y-6 backdrop-blur-md">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="text-[10px] font-bold uppercase text-zinc-400 mb-2 block tracking-widest">Theme Identity</label>
                    <input type="text" id="in-theme" placeholder="Enter Theme Title" class="w-full bg-black/80 border border-white/10 p-4 rounded-2xl outline-none focus:border-[#d4af37] text-sm transition-all text-white">
                </div>
                
                <div>
                    <label class="text-[10px] font-bold uppercase text-zinc-400 mb-2 block tracking-widest">Visual Cover</label>
                    <div class="p-6 border border-dashed border-white/10 rounded-2xl bg-black/40 text-center hover:border-[#d4af37]/50 transition-all">
                        <input type="file" id="in-file" accept="image/*" class="text-[10px] text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[9px] file:bg-zinc-800 file:text-white file:font-bold">
                    </div>
                </div>

                <div id="verse-inputs" class="space-y-4 max-h-[400px] overflow-y-auto pr-2"></div>

                <div class="flex gap-4 pt-4">
                    <button onclick="addVerseField()" class="flex-1 py-4 bg-white/5 border border-white/10 rounded-2xl text-[9px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all text-white">Add Verse</button>
                    <button onclick="saveTheme()" class="flex-1 btn-gold py-4 rounded-2xl uppercase text-[10px] tracking-widest">Manifest</button>
                </div>
            </div>

            <div class="lg:col-span-7 space-y-8">
                <div class="bg-zinc-950/60 p-8 md:p-10 rounded-[3rem] border border-white/5 backdrop-blur-md">
                    <h3 class="text-[10px] font-bold uppercase text-zinc-400 mb-6 tracking-[0.3em]">System Engagement</h3>
                    <canvas id="leadsChart" height="180"></canvas>
                </div>
                
                <div id="admin-theme-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </section>

    <div id="modal-amen" class="fixed inset-0 bg-black/90 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-xl">
        <div class="bg-zinc-950 p-8 md:p-12 rounded-[3rem] w-full max-w-md text-center border border-white/10 shadow-2xl relative">
            <h3 class="font-sacred text-[#d4af37] text-2xl mb-2 tracking-widest">SEAL THE WORD</h3>
            <p class="text-[10px] text-zinc-400 uppercase tracking-widest mb-8 font-medium">Record your affirmation</p>
            <input type="text" id="reg-name" placeholder="Full Name" class="w-full bg-black border border-white/10 p-4 rounded-2xl mb-4 outline-none text-sm transition-all focus:border-[#d4af37] text-white">
            <input type="tel" id="reg-phone" placeholder="Phone Number" class="w-full bg-black border border-white/10 p-4 rounded-2xl mb-8 outline-none text-sm transition-all focus:border-[#d4af37] text-white">
            <button onclick="submitAmen()" class="w-full btn-gold py-4 rounded-2xl text-xs uppercase tracking-[0.3em]">Confirm Amen</button>
            <button onclick="document.getElementById('modal-amen').classList.add('hidden')" class="mt-6 text-[9px] text-zinc-500 font-bold uppercase tracking-widest hover:text-white transition-colors">Cancel</button>
        </div>
    </div>

    <script>
        let currentVerseIndex = 0;
        let activeVerses = [];
        let allThemes = [];
        let recognition;
        let isMeditationActive = false;
        let currentThemeName = "";
        
        // Advanced tracking structure per verse: { totalWords, spokenMap: [], percentage: 0, fullyManifested: false }
        let versesState = [];

        async function handleLogin() {
            const e = document.getElementById('adm-email').value;
            const p = document.getElementById('adm-pass').value;
            try { await fb.signInWithEmailAndPassword(fb.auth, e, p); showPage('admin'); } catch(err) { alert("Access Denied"); }
        }
        function handleLogout() { fb.signOut(fb.auth).then(() => location.reload()); }
        
        function showPage(id) {
            ['page-user', 'page-admin', 'page-login'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
            if(id === 'user') exitMeditation();
        }

        function initLibrary() {
            fb.onSnapshot(fb.query(fb.collection(fb.db, "themes"), fb.orderBy("timestamp", "desc")), (snap) => {
                allThemes = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderGrid(allThemes);
                renderAdminList(allThemes);
                populateExportOptions();
            });
            initAnalytics();
        }

        function renderGrid(themes) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = themes.map(t => `
                <div onclick="openMeditation('${t.id}')" class="flex flex-col items-center gap-5 cursor-pointer group">
                    <div class="theme-circle">
                        <img src="${t.image || 'https://via.placeholder.com/150/050505/d4af37?text=The+Word'}" class="w-full h-full object-cover opacity-40 group-hover:opacity-100 transition duration-500">
                    </div>
                    <h3 class="font-sacred text-[11px] tracking-[0.3em] uppercase text-zinc-400 group-hover:text-[#d4af37] transition-all text-center max-w-[160px]">${t.theme}</h3>
                </div>
            `).join('');
        }

        async function openMeditation(id) {
            const target = allThemes.find(t => t.id === id);
            activeVerses = target.verses;
            currentThemeName = target.theme;
            currentVerseIndex = 0;
            
            // Initialize exact structure for tracking each verse
            versesState = activeVerses.map(v => {
                const words = v.text.replace(/[\r\n]+/g, ' ').trim().split(/\s+/);
                return {
                    words: words,
                    cleanWords: words.map(w => w.toLowerCase().replace(/[^a-z0-0]/g, '')),
                    spokenMap: new Array(words.length).fill(false),
                    percentage: 0,
                    fullyManifested: false
                };
            });
            
            document.getElementById('grid-container').classList.add('hidden');
            document.getElementById('meditation-zone').classList.remove('hidden');
            document.getElementById('total-verses').innerText = activeVerses.length;
            
            isMeditationActive = true;
            updateSealButtonState();
            loadVerse(0);
            startVoiceEngine();
        }

        function loadVerse(index) {
            currentVerseIndex = index;
            const vState = versesState[index];
            const display = document.getElementById('active-verse-text');
            const refDisp = document.getElementById('active-verse-ref');
            
            display.classList.remove('verse-float');
            void display.offsetWidth; 
            display.classList.add('verse-float');

            // Render interactive styled words
            display.innerHTML = vState.words.map((word, wIdx) => {
                const isSpoken = vState.spokenMap[wIdx];
                return `<span id="word-${index}-${wIdx}" class="word-unit ${isSpoken ? 'manifested' : ''}">${word}</span>`;
            }).join(' ');

            refDisp.innerText = activeVerses[index].ref;
            document.getElementById('verse-count').innerText = index + 1;

            // Nav buttons update
            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === activeVerses.length - 1;

            updateUIProgress();
        }

        function updateUIProgress() {
            const vState = versesState[currentVerseIndex];
            
            // Calculate Current Verse Manifest %
            document.getElementById('verse-prog-bar').style.width = vState.percentage + "%";
            document.getElementById('current-verse-manifest').innerText = vState.percentage + "% Verse";

            // Calculate Theme Overall Manifest %
            const totalThemeWords = versesState.reduce((acc, v) => acc + v.cleanWords.length, 0);
            const totalSpokenThemeWords = versesState.reduce((acc, v) => acc + v.spokenMap.filter(Boolean).length, 0);
            const themeTotalPercent = totalThemeWords > 0 ? Math.round((totalSpokenThemeWords / totalThemeWords) * 100) : 0;
            
            document.getElementById('theme-total-manifest').innerText = themeTotalPercent + "% Theme Total";

            updateSealButtonState();
        }

        function startVoiceEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return;
            
            if(recognition) {
                try { recognition.stop(); } catch(e){}
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if(!isMeditationActive) return;
                let transcript = ""; 
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript.toLowerCase() + " ";
                }
                
                const spokenTokens = transcript.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
                const vState = versesState[currentVerseIndex];

                spokenTokens.forEach(spoken => {
                    vState.cleanWords.forEach((target, wIdx) => {
                        if (!vState.spokenMap[wIdx] && target.length > 0) {
                            if (spoken === target || (target.length > 3 && (spoken.includes(target) || target.includes(spoken)))) {
                                vState.spokenMap[wIdx] = true;
                                const el = document.getElementById(`word-${currentVerseIndex}-${wIdx}`);
                                if (el) el.classList.add('manifested');
                            }
                        }
                    });
                });

                // Calculate progress accurately based on words spoken
                const spokenCount = vState.spokenMap.filter(Boolean).length;
                vState.percentage = Math.round((spokenCount / vState.cleanWords.length) * 100);

                if (vState.percentage >= 100) {
                    vState.percentage = 100;
                    vState.fullyManifested = true;
                }

                updateUIProgress();
            };

            recognition.onend = () => { 
                if(isMeditationActive) {
                    try { recognition.start(); } catch(e) {} 
                } 
            };

            try { recognition.start(); } catch(e){}
        }

        function updateSealButtonState() {
            // Strict condition: Amen button ONLY active if ALL scriptures in theme are 100% manifested
            const allManifested = versesState.every(v => v.percentage >= 100);
            const btn = document.getElementById('btn-amen');
            
            if (allManifested) {
                btn.disabled = false;
                btn.classList.add('animate-bounce');
            } else {
                btn.disabled = true;
                btn.classList.remove('animate-bounce');
            }
        }

        function nextVerse() { 
            if (currentVerseIndex < activeVerses.length - 1) { 
                loadVerse(currentVerseIndex + 1); 
            } 
        }

        function prevVerse() { 
            if (currentVerseIndex > 0) { 
                loadVerse(currentVerseIndex - 1); 
            } 
        }

        function exitMeditation() {
            isMeditationActive = false;
            if(recognition) { 
                recognition.onend = null; 
                try { recognition.stop(); } catch(e){}
            }
            document.getElementById('meditation-zone').classList.add('hidden');
            document.getElementById('grid-container').classList.remove('hidden');
        }

        function renderAdminList(themes) {
            const list = document.getElementById('admin-theme-list');
            list.innerHTML = themes.map(t => `
                <div class="bg-zinc-900/40 p-6 rounded-[2rem] flex justify-between items-center border border-white/5 hover:border-[#d4af37]/30 transition-all">
                    <div>
                        <div class="text-[11px] font-sacred text-[#d4af37] tracking-widest uppercase">${t.theme}</div>
                        <div class="text-[8px] text-zinc-500 mt-1 font-bold uppercase">${t.verses.length} Scriptures</div>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="loadForEdit('${t.id}')" class="text-[9px] font-bold text-zinc-400 hover:text-white uppercase tracking-widest transition-colors">Edit</button>
                        <button onclick="confirmDelete('${t.id}')" class="text-[9px] font-bold text-red-700 hover:text-red-500 uppercase tracking-widest transition-colors">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function confirmDelete(id) {
            if(confirm("Permanently remove this theme from archive?")) await fb.deleteDoc(fb.doc(fb.db, "themes", id));
        }

        function loadForEdit(id) {
            const t = allThemes.find(x => x.id === id);
            if(!t) return;
            document.getElementById('edit-id').value = t.id;
            document.getElementById('in-theme').value = t.theme;
            document.getElementById('verse-inputs').innerHTML = "";
            t.verses.forEach(v => addVerseField(v));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetEditor() {
            document.getElementById('edit-id').value = "";
            document.getElementById('in-theme').value = "";
            document.getElementById('verse-inputs').innerHTML = "";
            document.getElementById('in-file').value = "";
        }

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = 500;
                        const scale = MAX_W / img.width;
                        canvas.width = MAX_W; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        async function saveTheme() {
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('in-theme').value;
            const fileInput = document.getElementById('in-file');
            if(!title) return alert("Title required.");

            let b64 = "";
            if(fileInput.files[0]) b64 = await compressImage(fileInput.files[0]);
            else if(id) b64 = allThemes.find(x => x.id === id).image;

            const verses = [];
            document.querySelectorAll('.verse-entry').forEach(el => {
                const t = el.querySelector('.v-text').value;
                const r = el.querySelector('.v-ref').value;
                if(t && r) verses.push({ text: t, ref: r });
            });

            const data = { theme: title, image: b64, verses, timestamp: new Date() };
            try {
                if(id) await fb.updateDoc(fb.doc(fb.db, "themes", id), data);
                else await fb.addDoc(fb.collection(fb.db, "themes"), data);
                resetEditor();
            } catch(e) { alert(e.message); }
        }

        function addVerseField(val = {ref: '', text: ''}) {
            const div = document.createElement('div');
            div.className = "verse-entry bg-black/60 p-5 rounded-2xl border border-white/5 space-y-3";
            div.innerHTML = `
                <div class="flex gap-3">
                    <input type="text" placeholder="John 3:16" class="v-ref flex-1 bg-black border border-white/10 p-3 rounded-xl text-[10px] text-white outline-none focus:border-[#d4af37]" value="${val.ref}">
                    <button onclick="fetchVerse(this)" class="bg-zinc-800 px-4 rounded-xl text-[8px] font-bold uppercase text-[#d4af37] hover:bg-zinc-700 transition-colors">Fetch KJV</button>
                </div>
                <textarea class="v-text w-full bg-black border border-white/10 p-3 rounded-xl text-[11px] outline-none focus:border-[#d4af37] min-h-[80px] text-white" placeholder="Scripture Text">${val.text}</textarea>
                <button onclick="this.parentElement.remove()" class="text-[8px] font-bold text-red-700 uppercase hover:text-red-500 transition-colors">Remove Verse</button>
            `;
            document.getElementById('verse-inputs').appendChild(div);
        }

        async function fetchVerse(btn) {
            const container = btn.closest('.verse-entry');
            const ref = container.querySelector('.v-ref').value;
            if(!ref) return;
            btn.innerText = "Fetching...";
            try {
                const res = await fetch(`https://bible-api.com/${ref}?translation=kjv`);
                const data = await res.json();
                if(data.text) {
                    container.querySelector('.v-text').value = data.text.trim();
                    btn.innerText = "Fetched";
                } else btn.innerText = "Failed";
            } catch(e) { btn.innerText = "Error"; }
        }

        function openAmenModal() { document.getElementById('modal-amen').classList.remove('hidden'); }
        
        async function submitAmen() {
            const n = document.getElementById('reg-name').value;
            const p = document.getElementById('reg-phone').value;

            if (!n || !p) return alert("Details required.");

            await fb.addDoc(fb.collection(fb.db, "userLeads"), {
                name: n,
                phone: p,
                theme: currentThemeName,
                timestamp: new Date()
            });

            const adminNumber = "254711176811";
            const adminMessage = `NEW THEME COMPLETION\n\nName: ${n}\nPhone: ${p}\nTheme: ${currentThemeName}`;
            const adminWhatsAppURL = `https://wa.me/${adminNumber}?text=${encodeURIComponent(adminMessage)}`;

            let cleanUserNumber = p.replace(/\D/g, '');
            if (cleanUserNumber.startsWith("0")) {
                cleanUserNumber = "254" + cleanUserNumber.substring(1);
            }

            const userMessage = `Thank you ${n} for declaring God's words on the theme "${currentThemeName}".\n\nOur Pastor will call you and pray with you shortly.\n\nBe blessed. In Jesus Name`;
            const userWhatsAppURL = `https://wa.me/${cleanUserNumber}?text=${encodeURIComponent(userMessage)}`;

            window.open(adminWhatsAppURL, "_blank");

            setTimeout(() => {
                window.open(userWhatsAppURL, "_blank");
            }, 1500);

            setTimeout(() => {
                location.reload();
            }, 3000);
        }

        async function exportThemeDaily() {
            const theme = document.getElementById('export-theme').value;
            const dateStr = document.getElementById('export-date').value;

            if (!theme || !dateStr) return alert("Select Theme and Date.");

            const start = new Date(dateStr); start.setHours(0,0,0,0);
            const end = new Date(dateStr); end.setHours(23,59,59,999);

            const q = fb.query(
                fb.collection(fb.db, "userLeads"),
                fb.where("theme", "==", theme),
                fb.where("timestamp", ">=", start),
                fb.where("timestamp", "<=", end)
            );

            const snap = await fb.getDocs(q);
            const data = snap.docs.map(d => ({
                Name: d.data().name,
                Phone: d.data().phone,
                Theme: d.data().theme,
                Time: d.data().timestamp.toDate().toLocaleString()
            }));

            if (data.length === 0) return alert("No records found for selected date.");

            const ws = XLSX.utils.json_to_sheet(data);
            const csv = XLSX.utils.sheet_to_csv(ws);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);

            link.setAttribute("href", url);
            link.setAttribute("download", `${theme}_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function populateExportOptions() {
            const select = document.getElementById('export-theme');
            if (select) select.innerHTML = '<option value="">Select Theme</option>' + allThemes.map(t => `<option value="${t.theme}">${t.theme}</option>`).join('');
        }
        function filterThemes() {
            const term = document.getElementById('user-search').value.toLowerCase();
            renderGrid(allThemes.filter(t => t.theme.toLowerCase().includes(term)));
        }
        function initAnalytics() {
            fb.onSnapshot(fb.collection(fb.db, "userLeads"), (snap) => {
                const leads = snap.docs.map(d => d.data()), counts = {};
                leads.forEach(l => counts[l.theme] = (counts[l.theme] || 0) + 1);
                const ctx = document.getElementById('leadsChart').getContext('2d');
                if(window.myChart) window.myChart.destroy();
                window.myChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: '#d4af37', borderRadius: 12 }] },
                    options: { 
                        plugins: { legend: { display: false } },
                        scales: { 
                            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#666' } },
                            x: { grid: { display: false }, ticks: { color: '#666', font: { size: 9 } } }
                        } 
                    }
                });
            });
        }

        window.onload = () => {
            initLibrary();
            fb.onAuthStateChanged(fb.auth, u => { 
                if(u) { 
                    const navBtn = document.getElementById('adm-nav-btn');
                    navBtn.innerText = "Dashboard"; 
                    navBtn.onclick = () => showPage('admin'); 
                } 
            });
        };
    </script>
</body>
