    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Inter:wght@300;400;600&display=swap');

<body>

    <nav class="p-4 bg-black/95 border-b border-white/5 flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-sacred text-[#d4af37] tracking-[0.2em] text-xs cursor-pointer" onclick="location.reload()">THE LIVING WORD</h1>
        <div class="flex items-center gap-4">
            <input type="text" id="user-search" oninput="filterThemes()" placeholder="Search Library..." class="bg-white/5 border border-white/10 rounded-full px-4 py-1 text-[10px] outline-none focus:border-[#d4af37] w-32 md:w-48">

    <section id="page-user" class="min-h-screen py-12 px-6">

        <div id="meditation-zone" class="hidden flex flex-col items-center pt-6">

                <button onclick="exitMeditation()" class="text-[10px] text-zinc-500 uppercase tracking-widest hover:text-red-500">✕ Close Sanctuary</button>
                <div id="mic-status" class="text-[10px] text-[#d4af37] uppercase tracking-widest animate-pulse">Engaging Voice Engine...</div>
            </div>
            
            <div id="progress-container" class="w-full max-w-lg mb-12">
                <div class="flex justify-between text-[9px] uppercase mb-2 text-zinc-500">
                    <span>Scripture <span id="verse-count">1</span>/<span id="total-verses">1</span></span>
                    <span id="word-match-stats">0% Manifested</span>
                </div>
                <div class="h-[1px] bg-white/10 w-full">
                    <div id="verse-prog-bar" class="h-full bg-[#d4af37] w-0 transition-all duration-500"></div>
                </div>

            <div class="max-w-3xl w-full text-center min-h-[350px] flex flex-col justify-center items-center">

            <div class="flex gap-12 items-center mt-12">

    <section id="page-login" class="hidden min-h-[80vh] flex items-center justify-center">

            <button onclick="handleLogin()" class="w-full btn-gold py-4 rounded-2xl text-[10px] uppercase tracking-widest">Enter Dashboard</button>

    <section id="page-admin" class="hidden p-6 lg:p-12">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6 border-b border-white/5 pb-8">
            <div>
                <h2 class="font-sacred text-[#d4af37] text-2xl tracking-tighter">WORD ARCHITECT</h2>

                        <option value="">Select Theme</option>
                    </select>
                    <input type="date" id="export-date" class="bg-black border border-white/10 text-[10px] px-3 py-2 rounded-xl outline-none">
                </div>
                <button onclick="exportThemeDaily()" class="text-[9px] bg-green-950/20 text-green-500 px-6 py-3 rounded-full border border-green-500/30 font-bold uppercase">Export CSV</button>
                <button onclick="handleLogout()" class="text-[9px] text-red-500 uppercase tracking-widest border border-red-500/20 px-4 py-3 rounded-full">Sign Out</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div class="bg-zinc-950/50 p-10 rounded-[3rem] border border-white/5 space-y-6">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="text-[9px] uppercase text-zinc-500 mb-2 block">Theme Identity</label>
                    <input type="text" id="in-theme" placeholder="Title of Manifestation" class="w-full bg-black border border-white/10 p-5 rounded-3xl outline-none focus:border-[#d4af37] text-sm">
                </div>
                
                <div>
                    <label class="text-[9px] uppercase text-zinc-500 mb-2 block">Visual Essence</label>
                    <div class="p-6 border border-dashed border-white/10 rounded-3xl bg-black/40 text-center">
                        <input type="file" id="in-file" accept="image/*" class="text-[10px] text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[9px] file:bg-zinc-800 file:text-zinc-300">

                    </div>

                <div class="flex gap-4">
                    <button onclick="addVerseField()" class="flex-1 py-4 border border-white/10 rounded-3xl text-[9px] uppercase tracking-widest opacity-60 hover:opacity-100">+ Add Scripture</button>

                <div class="bg-zinc-950/50 p-10 rounded-[3rem] border border-white/5">

    <div id="modal-amen" class="fixed inset-0 bg-black/98 hidden z-[100] flex items-center justify-center p-6 backdrop-blur-xl">
        <div class="bg-zinc-900 p-12 rounded-[3rem] w-full max-w-sm text-center border border-[#d4af37]/10">
            <h3 class="font-sacred text-[#d4af37] text-xl mb-8 tracking-widest">Seal Your Prayer</h3>
            <input type="text" id="reg-name" placeholder="Full Name" class="w-full bg-black border border-white/10 p-5 rounded-3xl mb-4 outline-none text-sm">
            <input type="tel" id="reg-phone" placeholder="Phone Number" class="w-full bg-black border border-white/10 p-5 rounded-3xl mb-10 outline-none text-sm">
            <button onclick="submitAmen()" class="w-full btn-gold py-5 rounded-3xl text-xs uppercase tracking-[0.3em]">Submit Amen</button>
            <button onclick="document.getElementById('modal-amen').classList.add('hidden')" class="mt-6 text-[9px] text-zinc-600 uppercase tracking-widest">Cancel</button>
        </div>
    </div>

    <script>
        let currentVerseIndex = 0;
        let activeVerses = [];
        let allThemes = [];
        let recognition;
        let isMeditationActive = false;
        let currentThemeName = "";
        let completionStatus = []; 
        let scriptureWords = []; // Logic updated to track repeated words separately

        // AUTH & NAVIGATION
        async function handleLogin() {
            const e = document.getElementById('adm-email').value;
            const p = document.getElementById('adm-pass').value;
            try { await fb.signInWithEmailAndPassword(fb.auth, e, p); showPage('admin'); } catch(err) { alert("Access Denied"); }
        }
        function handleLogout() { fb.signOut(fb.auth).then(() => location.reload()); }
        
        function showPage(id) {
            ['page-user', 'page-admin', 'page-login'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
            if(id === 'user') exitMeditation();
        }

        // INITIALIZATION
        function initLibrary() {
            fb.onSnapshot(fb.query(fb.collection(fb.db, "themes"), fb.orderBy("timestamp", "desc")), (snap) => {
                allThemes = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderGrid(allThemes);
                renderAdminList(allThemes);
                populateExportOptions();
            });
            initAnalytics();
        }

        function renderGrid(themes) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = themes.map(t => `
                <div onclick="openMeditation('${t.id}')" class="flex flex-col items-center gap-6 cursor-pointer group">
                    <div class="theme-circle">
                        <img src="${t.image || 'https://via.placeholder.com/150/050505/d4af37?text=The+Word'}" class="w-full h-full object-cover opacity-40 group-hover:opacity-100 transition duration-1000">
                    </div>
                    <h3 class="font-sacred text-[10px] tracking-[0.3em] uppercase text-zinc-600 group-hover:text-[#d4af37] transition-colors">${t.theme}</h3>
                </div>
            `).join('');
        }

        // MEDITATION & VOICE ENGINE
        async function openMeditation(id) {
            const target = allThemes.find(t => t.id === id);
            activeVerses = target.verses;
            currentThemeName = target.theme;
            currentVerseIndex = 0;
            completionStatus = new Array(activeVerses.length).fill(false);
            
            document.getElementById('grid-container').classList.add('hidden');
            document.getElementById('meditation-zone').classList.remove('hidden');
            document.getElementById('total-verses').innerText = activeVerses.length;
            document.getElementById('btn-amen').disabled = true;
            document.getElementById('btn-amen').className = "px-20 py-5 rounded-full border border-zinc-800 text-zinc-800 font-bold uppercase tracking-[0.3em] transition-all";
            
            isMeditationActive = true;
            loadVerse(0);
            startVoiceEngine();
        }

        function loadVerse(index) {
            // Map words into a tracking array to support repetitions
            scriptureWords = activeVerses[index].text.toLowerCase()
                .split(/\W+/)
                .filter(w => w.length > 2)
                .map(w => ({ word: w, met: false }));

            const display = document.getElementById('active-verse-text');
            const refDisp = document.getElementById('active-verse-ref');
            display.style.opacity = "0";
            
            setTimeout(() => {
                display.innerText = activeVerses[index].text;
                refDisp.innerText = activeVerses[index].ref;
                display.style.opacity = "1";
                document.getElementById('verse-count').innerText = index + 1;
                
                const p = completionStatus[index] ? 100 : 0;
                document.getElementById('verse-prog-bar').style.width = p + "%";
                document.getElementById('word-match-stats').innerText = p + "% Manifested";
                
                if(recognition) {
                    try { recognition.stop(); } catch(e) {}
                }
            }, 500);
        }

        function startVoiceEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) {
                document.getElementById('mic-status').innerText = "Voice API Unsupported";
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => document.getElementById('mic-status').innerText = "Voice Engine Active";
            
            recognition.onresult = (event) => {
                if(!isMeditationActive) return;
                let transcript = ""; 
                for (let i = event.resultIndex; i < event.results.length; ++i) transcript += event.results[i][0].transcript.toLowerCase();
                
                const spokenWords = transcript.split(/\W+/);
                
                // For each spoken word, find the first occurrence in the scripture that hasn't been "met" yet
                spokenWords.forEach(spoken => {
                    const target = scriptureWords.find(item => item.word === spoken && !item.met);
                    if(target) target.met = true;
                });

                const metCount = scriptureWords.filter(item => item.met).length;
                const totalCount = scriptureWords.length;
                const p = Math.round((metCount / totalCount) * 100);

                document.getElementById('verse-prog-bar').style.width = p + "%";
                document.getElementById('word-match-stats').innerText = p + "% Manifested";

                if (p >= 75 || transcript.includes("amen")) {
                    completionStatus[currentVerseIndex] = true;
                    checkFinalAmen();
                }
            };

            recognition.onend = () => { if(isMeditationActive) try { recognition.start(); } catch(e) {} };
            recognition.start();
        }

        function checkFinalAmen() {
            if(completionStatus.every(s => s === true)) {
                const btn = document.getElementById('btn-amen');
                btn.disabled = false;
                btn.className = "px-20 py-5 rounded-full btn-gold text-black shadow-[0_0_30px_rgba(212,175,55,0.3)] font-bold uppercase tracking-[0.3em] scale-105 transition-all";
                document.getElementById('word-match-stats').innerText = "Word Sealed. Ready for Amen.";
            }
        }

        function nextVerse() { if (currentVerseIndex < activeVerses.length - 1) { currentVerseIndex++; loadVerse(currentVerseIndex); } }
        function prevVerse() { if (currentVerseIndex > 0) { currentVerseIndex--; loadVerse(currentVerseIndex); } }
        function exitMeditation() {
            isMeditationActive = false;
            if(recognition) { recognition.onend = null; recognition.stop(); }
            document.getElementById('meditation-zone').classList.add('hidden');
            document.getElementById('grid-container').classList.remove('hidden');
        }

        // ADMIN CRUD: EDIT, DELETE, UPLOAD
        function renderAdminList(themes) {
            const list = document.getElementById('admin-theme-list');
            list.innerHTML = themes.map(t => `
                <div class="bg-zinc-900/40 p-6 rounded-[2rem] flex justify-between items-center border border-white/5 hover:border-[#d4af37]/30 transition-all group">
                    <div>
                        <div class="text-[10px] font-sacred text-[#d4af37] tracking-widest uppercase">${t.theme}</div>
                        <div class="text-[8px] text-zinc-600 mt-1 uppercase">${t.verses.length} Scriptures Archived</div>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="loadForEdit('${t.id}')" class="text-[9px] text-zinc-400 hover:text-white uppercase tracking-widest">Edit</button>
                        <button onclick="confirmDelete('${t.id}')" class="text-[9px] text-red-900 hover:text-red-500 uppercase tracking-widest">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function confirmDelete(id) {
            if(confirm("Are you sure you want to remove this Word from the archive?")) {
                await fb.deleteDoc(fb.doc(fb.db, "themes", id));
            }
        }

        function loadForEdit(id) {
            const t = allThemes.find(x => x.id === id);
            if(!t) return;
            document.getElementById('edit-id').value = t.id;
            document.getElementById('in-theme').value = t.theme;
            document.getElementById('verse-inputs').innerHTML = "";
            t.verses.forEach(v => addVerseField(v));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetEditor() {
            document.getElementById('edit-id').value = "";
            document.getElementById('in-theme').value = "";
            document.getElementById('verse-inputs').innerHTML = "";
            document.getElementById('in-file').value = "";
        }

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_W = 500;
                        const scale = MAX_W / img.width;
                        canvas.width = MAX_W;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        async function saveTheme() {
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('in-theme').value;
            const fileInput = document.getElementById('in-file');
            
            if(!title) return alert("Theme title is required.");

            let b64 = "";
            if(fileInput.files[0]) { 
                b64 = await compressImage(fileInput.files[0]); 
            } else if(id) {
                b64 = allThemes.find(x => x.id === id).image;
            }

            const verses = [];
            document.querySelectorAll('.verse-entry').forEach(el => {
                const t = el.querySelector('.v-text').value;
                const r = el.querySelector('.v-ref').value;
                if(t && r) verses.push({ text: t, ref: r });
            });

            if(verses.length === 0) return alert("At least one scripture is required.");

            const data = { theme: title, image: b64, verses, timestamp: new Date() };

            try {
                if(id) {
                    await fb.updateDoc(fb.doc(fb.db, "themes", id), data);
                    alert("Word Updated.");
                } else {
                    await fb.addDoc(fb.collection(fb.db, "themes"), data);
                    alert("Word Manifested.");
                }
                resetEditor();
            } catch(e) { alert("Logic Error: " + e.message); }
        }

        // BIBLE API & FIELDS
        function addVerseField(val = {ref: '', text: ''}) {
            const div = document.createElement('div');
            div.className = "verse-entry bg-black p-5 rounded-3xl border border-white/5 space-y-3 relative";
            div.innerHTML = `
                <div class="flex gap-3">
                    <input type="text" placeholder="Bible Ref (e.g. John 3:16)" class="v-ref flex-1 bg-zinc-900 border border-white/5 p-3 rounded-xl text-[10px] outline-none focus:border-[#d4af37]" value="${val.ref}">
                    <button onclick="fetchVerse(this)" class="bg-zinc-800 px-4 rounded-xl text-[8px] uppercase font-bold text-[#d4af37]">Fetch API</button>
                </div>
                <textarea class="v-text w-full bg-zinc-900 border border-white/5 p-4 rounded-xl text-[11px] outline-none focus:border-[#d4af37] min-h-[80px]" placeholder="The Scripture Text...">${val.text}</textarea>
                <button onclick="this.parentElement.remove()" class="text-[8px] text-red-900 uppercase hover:text-red-500">Remove Field</button>
            `;
            document.getElementById('verse-inputs').appendChild(div);
        }

        async function fetchVerse(btn) {
            const container = btn.closest('.verse-entry');
            const ref = container.querySelector('.v-ref').value;
            if(!ref) return;
            btn.innerText = "Searching...";
            try {
                const res = await fetch(`https://bible-api.com/${ref}`);
                const data = await res.json();
                if(data.text) {
                    container.querySelector('.v-text').value = data.text.trim();
                    btn.innerText = "Success";
                } else { btn.innerText = "Not Found"; }
            } catch(e) { btn.innerText = "Error"; }
        }

        // LEAD SUBMISSION & EXPORT
        function openAmenModal() { document.getElementById('modal-amen').classList.remove('hidden'); }
        async function submitAmen() {
            const n = document.getElementById('reg-name').value;
            const p = document.getElementById('reg-phone').value;
            if(!n || !p) return alert("Identify yourself to seal the word.");
            await fb.addDoc(fb.collection(fb.db, "userLeads"), { 
                name: n, phone: p, theme: currentThemeName, timestamp: new Date() 
            });
            alert("Your Amen has been recorded in the Sanctuary.");
            location.reload();
        }

        async function exportThemeDaily() {
            const theme = document.getElementById('export-theme').value;
            const dateStr = document.getElementById('export-date').value;
            if(!theme || !dateStr) return alert("Select Theme and Date.");

            const start = new Date(dateStr); start.setHours(0,0,0,0);
            const end = new Date(dateStr); end.setHours(23,59,59,999);

            const q = fb.query(fb.collection(fb.db, "userLeads"), fb.where("theme", "==", theme), fb.where("timestamp", ">=", start), fb.where("timestamp", "<=", end));
            const snap = await fb.getDocs(q);
            const data = snap.docs.map(d => ({ 
                Name: d.data().name, 
                Phone: d.data().phone, 
                Time: d.data().timestamp.toDate().toLocaleString() 
            }));

            if(data.length === 0) return alert("No seals found for this selection.");
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Seals");
            XLSX.writeFile(wb, `${theme}_${dateStr}.xlsx`);
        }

        // UTILITIES
        function populateExportOptions() {
            const select = document.getElementById('export-theme');
            if (select) {
                select.innerHTML = '<option value="">Select Theme</option>' + 
                    allThemes.map(t => `<option value="${t.theme}">${t.theme}</option>`).join('');
            }
        }
        function filterThemes() {
            const term = document.getElementById('user-search').value.toLowerCase();
            renderGrid(allThemes.filter(t => t.theme.toLowerCase().includes(term)));
        }
        function initAnalytics() {
            fb.onSnapshot(fb.collection(fb.db, "userLeads"), (snap) => {
                const leads = snap.docs.map(d => d.data());
                const counts = {};
                leads.forEach(l => counts[l.theme] = (counts[l.theme] || 0) + 1);
                const ctx = document.getElementById('leadsChart').getContext('2d');
                if(window.myChart) window.myChart.destroy();
                window.myChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: '#d4af37', borderRadius: 10 }] },
                    options: { 
                        plugins: { legend: { display: false } },
                        scales: { 
                            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#666' } },
                            x: { grid: { display: false }, ticks: { color: '#666', font: { size: 8 } } }
                        } 
                    }
                });
            });
        }

        window.onload = () => {
            initLibrary();
            fb.onAuthStateChanged(fb.auth, u => { 
                if(u) { 
                    const navBtn = document.getElementById('adm-nav-btn');
                    if (navBtn) {
                        navBtn.innerText = "Dashboard"; 
                        navBtn.onclick = () => showPage('admin'); 
                    }
                } 
            });
        };
    </script>
</body>
</html>
